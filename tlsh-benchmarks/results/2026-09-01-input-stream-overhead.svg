<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title description">
  <title id="title">TLSH byte-array and input-stream benchmark results</title>
  <desc id="description">Two grouped bar charts compare input throughput and normalized allocation for byte-array and input-stream hashing at three input sizes.</desc>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">TLSH input API comparison — 2026-09-01</text>
  <text x="500" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#526078">Same bytes, JDK, JMH invocation, and Compiler Blackhole mode</text>

  <text x="270" y="91" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172033">Input throughput (MiB/s)</text>
  <line x1="65" y1="410" x2="485" y2="410" stroke="#8b96a8"/>
  <line x1="65" y1="100" x2="65" y2="410" stroke="#8b96a8"/>
  <g font-family="sans-serif" font-size="11" fill="#526078" text-anchor="end">
    <text x="58" y="414">0</text>
    <text x="58" y="326">20</text>
    <text x="58" y="237">40</text>
    <text x="58" y="149">60</text>
  </g>
  <g stroke="#e3e7ee">
    <line x1="65" y1="321" x2="485" y2="321"/>
    <line x1="65" y1="233" x2="485" y2="233"/>
    <line x1="65" y1="144" x2="485" y2="144"/>
  </g>
  <g>
    <rect x="105" y="140" width="30" height="270" rx="3" fill="#2864dc"/>
    <rect x="139" y="164" width="30" height="246" rx="3" fill="#18a675"/>
    <rect x="238" y="123" width="30" height="287" rx="3" fill="#2864dc"/>
    <rect x="272" y="134" width="30" height="276" rx="3" fill="#18a675"/>
    <rect x="371" y="114" width="30" height="296" rx="3" fill="#2864dc"/>
    <rect x="405" y="128" width="30" height="282" rx="3" fill="#18a675"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#172033" text-anchor="middle">
    <text x="120" y="133">61.00</text>
    <text x="154" y="157">55.66</text>
    <text x="253" y="116">64.88</text>
    <text x="287" y="127">62.41</text>
    <text x="386" y="107">66.77</text>
    <text x="420" y="121">63.61</text>
    <text x="137" y="431">256 B</text>
    <text x="270" y="431">4 KiB</text>
    <text x="403" y="431">1 MiB</text>
  </g>

  <text x="755" y="91" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172033">Allocation (KiB/op)</text>
  <line x1="560" y1="410" x2="955" y2="410" stroke="#8b96a8"/>
  <line x1="560" y1="100" x2="560" y2="410" stroke="#8b96a8"/>
  <g font-family="sans-serif" font-size="11" fill="#526078" text-anchor="end">
    <text x="553" y="414">0</text>
    <text x="553" y="337">4</text>
    <text x="553" y="259">8</text>
    <text x="553" y="182">12</text>
    <text x="553" y="104">16</text>
  </g>
  <g stroke="#e3e7ee">
    <line x1="560" y1="333" x2="955" y2="333"/>
    <line x1="560" y1="255" x2="955" y2="255"/>
    <line x1="560" y1="178" x2="955" y2="178"/>
    <line x1="560" y1="100" x2="955" y2="100"/>
  </g>
  <g>
    <rect x="600" y="279" width="30" height="131" rx="3" fill="#2864dc"/>
    <rect x="634" y="124" width="30" height="286" rx="3" fill="#18a675"/>
    <rect x="733" y="274" width="30" height="136" rx="3" fill="#2864dc"/>
    <rect x="767" y="124" width="30" height="286" rx="3" fill="#18a675"/>
    <rect x="866" y="272" width="30" height="138" rx="3" fill="#2864dc"/>
    <rect x="900" y="117" width="30" height="293" rx="3" fill="#18a675"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#172033" text-anchor="middle">
    <text x="615" y="272">6.74</text>
    <text x="649" y="117">14.76</text>
    <text x="748" y="267">7.01</text>
    <text x="782" y="117">14.76</text>
    <text x="881" y="265">7.10</text>
    <text x="915" y="110">15.10</text>
    <text x="632" y="431">256 B</text>
    <text x="765" y="431">4 KiB</text>
    <text x="898" y="431">1 MiB</text>
  </g>

  <g font-family="sans-serif" font-size="12" fill="#172033">
    <rect x="385" y="475" width="14" height="14" rx="2" fill="#2864dc"/>
    <text x="407" y="487">byte[]</text>
    <rect x="475" y="475" width="14" height="14" rx="2" fill="#18a675"/>
    <text x="497" y="487">InputStream</text>
  </g>
  <text x="500" y="520" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#68758b">Exploratory result from one Apple M3 Pro development machine; see the report for methodology and limits.</text>
</svg>
