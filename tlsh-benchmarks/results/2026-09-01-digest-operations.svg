<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title description">
  <title id="title">TLSH digest parsing and distance benchmark results</title>
  <desc id="description">Two bar charts compare throughput and normalized allocation for digest parsing and distance calculation with and without length.</desc>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">TLSH digest operations — 2026-09-01</text>
  <text x="500" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#526078">Parsing and comparison measured independently of input hashing</text>

  <text x="270" y="91" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172033">Throughput (million ops/s)</text>
  <line x1="65" y1="410" x2="485" y2="410" stroke="#8b96a8"/>
  <line x1="65" y1="100" x2="65" y2="410" stroke="#8b96a8"/>
  <g font-family="sans-serif" font-size="11" fill="#526078" text-anchor="end">
    <text x="58" y="414">0</text>
    <text x="58" y="328">5</text>
    <text x="58" y="242">10</text>
    <text x="58" y="156">15</text>
  </g>
  <g stroke="#e3e7ee">
    <line x1="65" y1="324" x2="485" y2="324"/>
    <line x1="65" y1="238" x2="485" y2="238"/>
    <line x1="65" y1="152" x2="485" y2="152"/>
  </g>
  <rect x="108" y="124" width="70" height="286" rx="4" fill="#2864dc"/>
  <rect x="240" y="238" width="70" height="172" rx="4" fill="#18a675"/>
  <rect x="372" y="218" width="70" height="192" rx="4" fill="#d97a24"/>
  <g font-family="sans-serif" font-size="11" fill="#172033" text-anchor="middle">
    <text x="143" y="117">16.61</text>
    <text x="275" y="231">9.97</text>
    <text x="407" y="211">11.18</text>
    <text x="143" y="431">Parse</text>
    <text x="275" y="431">Distance + length</text>
    <text x="407" y="431">Distance − length</text>
  </g>

  <text x="755" y="91" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172033">Allocation (B/op)</text>
  <line x1="560" y1="410" x2="955" y2="410" stroke="#8b96a8"/>
  <line x1="560" y1="100" x2="560" y2="410" stroke="#8b96a8"/>
  <g font-family="sans-serif" font-size="11" fill="#526078" text-anchor="end">
    <text x="553" y="414">0</text>
    <text x="553" y="310">100</text>
    <text x="553" y="207">200</text>
    <text x="553" y="104">300</text>
  </g>
  <g stroke="#e3e7ee">
    <line x1="560" y1="307" x2="955" y2="307"/>
    <line x1="560" y1="203" x2="955" y2="203"/>
    <line x1="560" y1="100" x2="955" y2="100"/>
  </g>
  <rect x="603" y="129" width="70" height="281" rx="4" fill="#2864dc"/>
  <rect x="735" y="311" width="70" height="99" rx="4" fill="#18a675"/>
  <rect x="867" y="311" width="70" height="99" rx="4" fill="#d97a24"/>
  <g font-family="sans-serif" font-size="11" fill="#172033" text-anchor="middle">
    <text x="638" y="122">272</text>
    <text x="770" y="304">96</text>
    <text x="902" y="304">96</text>
    <text x="638" y="431">Parse</text>
    <text x="770" y="431">Distance + length</text>
    <text x="902" y="431">Distance − length</text>
  </g>

  <g font-family="sans-serif" font-size="12" fill="#172033">
    <rect x="344" y="475" width="14" height="14" rx="2" fill="#2864dc"/>
    <text x="366" y="487">Parse</text>
    <rect x="420" y="475" width="14" height="14" rx="2" fill="#18a675"/>
    <text x="442" y="487">Distance with length</text>
    <rect x="579" y="475" width="14" height="14" rx="2" fill="#d97a24"/>
    <text x="601" y="487">Distance without length</text>
  </g>
  <text x="500" y="520" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#68758b">Exploratory result from one Apple M3 Pro development machine; see the report for methodology and limits.</text>
</svg>
